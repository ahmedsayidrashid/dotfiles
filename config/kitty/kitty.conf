# BEGIN_KITTY_THEME
# orange theme
include current-theme.conf
# END_KITTY_THEME

# --- FONT CONFIGURATION ---
# Just use the clean name string without the 'family=' syntax
font_family      Fira Code
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        15

# --- BACKGROUND IMAGE ---
# Remove the comment and ensure kitty knows how to scale it
background_image /home/ahmed/Pictures/ahmed.png
background_image_layout scaled
background_opacity 0.85

# --- WINDOW & BORDER ---
active_border_color #000000
window_margin_width 7
window_border_width 2pt

# --- TAB LOOK ---
tab_bar_style powerline
tab_powerline_style slanted
tab_activity_symbol *

# --- SSH TERM TYPE ---
term xterm-256color
